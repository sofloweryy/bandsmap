<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国独立乐队地图</title>
    <!-- 引入 Tailwind CSS 样式 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 ECharts 地图核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图 JSON 数据 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🎸</span>
            <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">
                全国独立乐队互动地图
            </h1>
        </div>
        <div class="text-xs text-slate-400">
            数据由 Supabase 强力驱动 | 探索中国地下与独立音乐场景
        </div>
    </header>

    <!-- 主体区域 -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- 左侧：乐队列表与筛选 -->
        <aside class="w-80 bg-slate-900/80 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-800">
                <input type="text" id="searchInput" placeholder="搜索乐队名称或城市..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
            </div>
            <div id="bandList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center text-slate-500 py-10 text-sm">正在加载乐队数据...</div>
            </div>
        </aside>

        <!-- 右侧：地图容器 -->
        <main class="flex-1 relative bg-slate-950">
            <div id="mapContainer" class="w-full h-full"></div>
            
            <!-- 乐队详情悬浮窗 -->
            <div id="bandCard" class="absolute top-6 right-6 w-80 bg-slate-900/95 border border-slate-700 rounded-xl p-5 shadow-2xl backdrop-blur-md hidden transition-all duration-300">
                <button onclick="closeCard()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-sm font-bold">✕</button>
                <img id="cardImage" src="" alt="" class="w-full h-40 object-cover rounded-lg mb-4 bg-slate-800">
                <div class="flex items-center justify-between mb-2">
                    <h2 id="cardName" class="text-lg font-bold text-amber-400">乐队名称</h2>
                    <span id="cardStyle" class="text-xs bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full border border-rose-500/30">风格</span>
                </div>
                <p id="cardCity" class="text-xs text-slate-400 mb-3">📍 城市</p>
                <p id="cardDesc" class="text-sm text-slate-300 leading-relaxed max-h-36 overflow-y-auto">乐队简介...</p>
            </div>
        </main>

    </div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBands = []; 
        let myChart = null; 

        function initMap() {
            const chartDom = document.getElementById('mapContainer');
            myChart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.seriesType === 'scatter') {
                            return `<b>${params.data.name}</b><br/>风格: ${params.data.style}<br/>城市: ${params.data.city}`;
                        }
                    }
                },
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: 1.2,
                    itemStyle: {
                        areaColor: '#1e293b', 
                        borderColor: '#334155',
                        borderWidth: 1
                    },
                    emphasis: {
                        itemStyle: { areaColor: '#334155' },
                        label: { show: false }
                    }
                },
                series: [{
                    name: '乐队分布',
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    // ECharts 允许直接用城市名作为 name，它会自动去地图组件里找对应的经纬度
                    data: [],
                    symbolSize: 14,
                    itemStyle: {
                        color: '#f59e0b',
                        shadowBlur: 10,
                        shadowColor: 'rgba(245, 158, 11, 0.5)'
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#ef4444',
                            scale: 1.5
                        }
                    }
                }]
            };

            myChart.setOption(option);

            myChart.on('click', function (params) {
                if (params.seriesType === 'scatter') {
                    showBandDetail(params.data);
                }
            });

            window.addEventListener('resize', () => myChart.resize());
        }

        async function fetchBands() {
            try {
                const { data, error } = await supabaseClient
                    .from('bands')
                    .select('*');

                if (error) throw error;

                // 直接把数据库里的 city 赋值给 name，ECharts 就会自动匹配该城市的经纬度
                allBands = data.map(item => ({
                    id: item.id,
                    name: item.name,
                    city: item.city,
                    style: item.style,
                    description: item.description,
                    cover_url: item.cover_url || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80',
                    // 在 ECharts 中，如果 coordinateSystem 是 geo，
                    // 只要 data 项里的 name 是中国地名（如 "北京"、"石家庄"），它就会自动解析坐标！
                    value: item.city 
                }));

                renderList(allBands);
                updateMapData(allBands);

            } catch (err) {
                console.error('获取乐队数据失败:', err);
                document.getElementById('bandList').innerHTML = `<div class="text-center text-rose-500 text-xs p-4">加载失败，请检查 Supabase 的 bands 表。</div>`;
            }
        }

        function updateMapData(bands) {
            // 转换为 ECharts 散点格式：每个点带上 city 名作为 name，ECharts 自动定位
            const mapData = bands.map(b => ({
                name: b.city, // 关键：用城市名让 ECharts 自动定位
                bandName: b.name,
                style: b.style,
                city: b.city,
                description: b.description,
                cover_url: b.cover_url,
                value: [] // 留空，由 ECharts 内部根据地名匹配
            }));

            // 重新包装以便 tooltip 能拿到乐队真实名字
            const formattedData = bands.map(b => ({
                name: b.name, // 悬浮提示显示的名称
                city: b.city,
                style: b.style,
                description: b.description,
                cover_url: b.cover_url,
                value: [b.city] // 传入城市名让 geo 自动解析
            }));

            myChart.setOption({
                series: [{
                    data: formattedData
                }]
            });
        }

        function renderList(bands) {
            const listContainer = document.getElementById('bandList');
            if (bands.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">暂无匹配的乐队</div>`;
                return;
            }

            listContainer.innerHTML = bands.map(band => `
                <div onclick="selectBand('${band.name}')" class="bg-slate-950/60 border border-slate-800 hover:border-amber-500/50 rounded-lg p-3 cursor-pointer transition-all group">
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="font-bold text-sm text-slate-200 group-hover:text-amber-400">${band.name}</h3>
                        <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${band.style}</span>
                    </div>
                    <p class="text-xs text-slate-400">📍 ${band.city}</p>
                </div>
            `).join('');
        }

        function selectBand(bandName) {
            const band = allBands.find(b => b.name === bandName);
            if (!band) return;

            showBandDetail(band);
        }

        function showBandDetail(band) {
            document.getElementById('cardImage').src = band.cover_url;
            document.getElementById('cardName').textContent = band.name;
            document.getElementById('cardStyle').textContent = band.style;
            document.getElementById('cardCity').textContent = `📍 ${band.city}`;
            document.getElementById('cardDesc').textContent = band.description || '暂无详细介绍...';
            document.getElementById('bandCard').classList.remove('hidden');
        }

        function closeCard() {
            document.getElementById('bandCard').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allBands.filter(b => 
                b.name.toLowerCase().includes(keyword) || 
                b.city.toLowerCase().includes(keyword) ||
                b.style.toLowerCase().includes(keyword)
            );
            renderList(filtered);
            updateMapData(filtered);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchBands();
        });
    </script>
</body>
</html>
