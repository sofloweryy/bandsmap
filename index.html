<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>独立乐队图鉴</title>
    <!-- 引入 ECharts 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图标准 JSON 数据 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }

        /* 左侧乐队列表侧边栏 */
        .sidebar {
            width: 320px;
            height: 100vh;
            background: rgba(13, 18, 30, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        .sidebar-title {
            padding: 22px 20px 14px 20px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title span {
            font-size: 12px;
            color: #94a3b8;
            font-weight: normal;
        }
        .band-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .band-list-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .band-list-item:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateX(2px);
        }
        .band-list-item.active {
            background: rgba(37, 99, 235, 0.25);
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .band-list-item .item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
        }
        .band-list-item .item-loc {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 中间主地图容器 */
        #map-container {
            flex: 1;
            height: 100vh;
        }

        /* 底部版权与作者信息栏 */
        .footer-banner {
            position: absolute;
            bottom: 12px;
            left: 340px;
            right: 24px;
            background: rgba(13, 18, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            backdrop-filter: blur(6px);
            z-index: 15;
            pointer-events: none;
        }

        /* 右上角乐队详细浮窗 */
        .band-card {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 320px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(12px);
            z-index: 20;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        .card-meta h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .card-tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .card-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
        }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
            transition: all 0.2s;
        }
        .like-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- 左侧乐队列表 -->
    <div class="sidebar">
        <div class="sidebar-title">
            <span>🎸 独立乐队图鉴</span>
            <span id="totalCount">加载中...</span>
        </div>
        <div class="band-list" id="bandList">
            <!-- 动态从 Supabase 加载 -->
        </div>
    </div>

    <!-- 中间地图区域 -->
    <div id="map-container"></div>

    <!-- 底部版权和交流提示 -->
    <div class="footer-banner">
        仅供娱乐切勿较真儿 | 欢迎乐迷交流指正 ｜ 联系美丽且智慧的开发者 公众号：摘花花 ｜ 邮箱：zhaihuahua1701@gmail.com
    </div>

    <!-- 右上角乐队信息面板 -->
    <div class="band-card">
        <div class="card-header">
            <img class="card-avatar" id="cardAvatar" src="https://picsum.photos/200/200?random=1" alt="头像">
            <div class="card-meta">
                <h3 id="cardName">请选择乐队</h3>
                <span class="card-tag" id="cardStyle">-</span>
            </div>
        </div>
        <div class="card-desc" id="cardDesc">
            📍 坐标：请点击左侧列表或地图上的点<br>✨ 简介：查看乐队详细信息
        </div>
        <button class="like-btn" id="likeBtn">❤️ 送出小心心 ( <span id="likeCount">0</span> )</button>
    </div>

    <script>
        // ==========================================
        // 1. 配置你的 Supabase 凭证
        // ==========================================
        const SUPABASE_URL = '你的Supabase_URL'; 
        const SUPABASE_ANON_KEY = '你的Supabase_ANON_KEY';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let bandDatabase = [];
        let currentActiveId = null;
        var myChart = null;

        // ==========================================
        // 2. 从 Supabase 异步加载真实 100+ 乐队数据
        // ==========================================
        async function fetchBandsFromSupabase() {
            try {
                // 假设你的表名叫 bands，字段包含 id, name, city, province, style, lng, lat, desc, likes
                const { data, error } = await _supabase.from('bands').select('*');
                
                if (error) {
                    console.error('加载 Supabase 数据失败:', error);
                    document.getElementById('totalCount').innerText = '加载失败';
                    return;
                }

                if (data && data.length > 0) {
                    bandDatabase = processCoordinatesOffset(data); // 核心：处理同坐标重叠点发散
                    currentActiveId = bandDatabase[0].id;
                    
                    document.getElementById('totalCount').innerText = `共 ${bandDatabase.length} 支乐队`;
                    renderSidebar();
                    updateCardContent(bandDatabase[0]);
                    initMap(bandDatabase);
                } else {
                    document.getElementById('totalCount').innerText = '暂无乐队数据';
                }
            } catch (err) {
                console.error('网络异常:', err);
            }
        }

        // ==========================================
        // 3. 智能坐标偏移算法（解决同省/同城市乐队重叠压盖问题）
        // ==========================================
        function processCoordinatesOffset(list) {
            const coordMap = {};
            return list.map(band => {
                let lng = Number(band.lng) || 104.06;
                let lat = Number(band.lat) || 30.57;
                
                const key = `${lng.toFixed(2)}_${lat.toFixed(2)}`;
                if (coordMap[key] === undefined) {
                    coordMap[key] = 0;
                } else {
                    coordMap[key]++;
                    // 如果发现经纬度重复（或处于同一城市中心），进行微小的随机发散处理
                    const angle = coordMap[key] * 137.5 * (Math.PI / 180); // 黄金角螺线发散
                    const radius = 0.08 * Math.sqrt(coordMap[key]);
                    lng += radius * Math.cos(angle);
                    lat += radius * Math.sin(angle);
                }

                return { ...band, lng, lat };
            });
        }

        // 渲染左侧列表
        const listContainer = document.getElementById('bandList');
        function renderSidebar() {
            listContainer.innerHTML = '';
            bandDatabase.forEach(band => {
                const item = document.createElement('div');
                item.className = `band-list-item ${band.id === currentActiveId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="item-name">${band.name}</div>
                    <div class="item-loc">📍 ${band.province || ''}·${band.city || ''} | ${band.style || ''}</div>
                `;
                item.onclick = () => {
                    currentActiveId = band.id;
                    renderSidebar();
                    updateCardContent(band);
                };
                listContainer.appendChild(item);
            });
        }

        // 更新右侧卡片显示
        function updateCardContent(band) {
            document.getElementById('cardName').innerText = band.name;
            document.getElementById('cardStyle').innerText = band.style || '独立音乐';
            document.getElementById('cardDesc').innerHTML = `📍 坐标：${band.province || ''}·${band.city || ''}<br>✨ 简介：${band.desc || '暂无简介'}`;
            document.getElementById('cardAvatar').src = band.avatar || `https://picsum.photos/200/200?random=${band.id}`;
            document.getElementById('likeCount').innerText = band.likes || 0;
        }

        // 点赞交互并实时同步更新 Supabase
        document.getElementById('likeBtn').onclick = async () => {
            const currentBand = bandDatabase.find(b => b.id === currentActiveId);
            if (currentBand) {
                currentBand.likes = (currentBand.likes || 0) + 1;
                document.getElementById('likeCount').innerText = currentBand.likes;

                // 同步更新到 Supabase 数据库
                try {
                    await _supabase
                        .from('bands')
                        .update({ likes: currentBand.likes })
                        .eq('id', currentBand.id);
                } catch (e) {
                    console.error('点赞同步数据库失败', e);
                }
            }
        };

        // ==========================================
        // 4. 初始化 ECharts 地图
        // ==========================================
        function initMap(data) {
            myChart = echarts.init(document.getElementById('map-container'));

            var scatterData = data.map(band => ({
                name: band.name,
                value: [band.lng, band.lat],
                bandObj: band
            }));

            var option = {
                backgroundColor: '#0b0f19',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.seriesType === 'effectScatter') {
                            return `<b>${params.data.bandObj.name}</b><br/>📍 ${params.data.bandObj.province || ''}·${params.data.bandObj.city || ''}`;
                        }
                        return params.name ? `<b>${params.name}</b> 音乐地图` : '';
                    }
                },
                geo: {
                    map: 'china',
                    roam: true,          // 允许缩放和拖拽平移
                    zoom: 1.25,
                    itemStyle: {
                        areaColor: '#131c2e',    // 省份默认底色
                        borderColor: '#1e293b',  // 地图边界线颜色
                        borderWidth: 1.2
                    },
                    // 鼠标悬停省份的样式（带你要求的精致黑阴影加粗白色文字）
                    emphasis: {
                        itemStyle: {
                            areaColor: '#1d4ed8', 
                            borderColor: '#60a5fa',
                            borderWidth: 1.5
                        },
                        label: {
                            show: true,              
                            color: '#ffffff',         
                            fontSize: 14,             
                            fontWeight: 'bold',       
                            fontFamily: 'sans-serif',
                            textShadowColor: 'rgba(0, 0, 0, 0.95)', 
                            textShadowBlur: 8,        
                            textShadowOffsetX: 1,     
                            textShadowOffsetY: 1      
                        }
                    },
                    // 点击选中省份时的样式
                    select: {
                        itemStyle: {
                            areaColor: '#2563eb',
                            borderColor: '#93c5fd',
                            borderWidth: 2
                        },
                        label: {
                            show: true,              
                            color: '#ffffff',
                            fontSize: 15,
                            fontWeight: 'bold',
                            textShadowColor: 'rgba(0, 0, 0, 0.95)',
                            textShadowBlur: 8
                        }
                    }
                },
                series: [
                    {
                        name: '地图背景',
                        type: 'map',
                        geoIndex: 0,
                        data: []
                    },
                    {
                        name: '乐队动态坐标',
                        type: 'effectScatter',       // 带波纹呼吸灯特效的散点
                        coordinateSystem: 'geo',
                        data: scatterData,
                        symbolSize: 8,
                        showEffectOn: 'render',
                        rippleEffect: {
                            brushType: 'stroke',
                            scale: 3.5,
                            period: 3
                        },
                        itemStyle: {
                            color: '#38bdf8',          
                            shadowBlur: 8,
                            shadowColor: '#38bdf8'
                        },
                        emphasis: {
                            scale: 1.6
                        }
                    }
                ]
            };

            myChart.setOption(option);

            // 点击地图散点联动
            myChart.on('click', function (params) {
                if (params.seriesType === 'effectScatter' && params.data.bandObj) {
                    const targetBand = params.data.bandObj;
                    currentActiveId = targetBand.id;
                    renderSidebar();
                    updateCardContent(targetBand);
                }
            });
        }

        // 页面启动时触发加载
        fetchBandsFromSupabase();

        // 窗口大小自适应
        window.addEventListener('resize', function () {
            if (myChart) myChart.resize();
        });
    </script>
</body>
</html>
