<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图 GeoJson 数据（国内稳定 CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text-main); }

        .header-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 56px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(10px); z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }
        .site-title { font-size: 17px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-quota { font-size: 12px; color: var(--text-secondary); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); }

        .main-layout { position: absolute; top: 56px; bottom: 36px; left: 0; width: 100%; display: flex; }

        .sidebar {
            width: 340px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 999;
        }
        .search-box-container { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .search-input {
            width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: var(--accent-color); }

        .rank-section-title { padding: 8px 16px 4px 16px; font-size: 11px; font-weight: 600; color: #facc15; letter-spacing: 0.5px; text-transform: uppercase; }
        .band-list { flex: 1; overflow-y: auto; padding: 8px 12px; }

        .band-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s ease;
        }
        .band-item:hover, .band-item.active { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); }
        .band-rank-num { font-size: 12px; font-weight: 700; color: var(--text-secondary); width: 18px; text-align: center; }
        .band-item:nth-child(1) .band-rank-num { color: #f59e0b; }
        .band-item:nth-child(2) .band-rank-num { color: #94a3b8; }
        .band-item:nth-child(3) .band-rank-num { color: #b45309; }

        .band-item-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); }
        .band-item-info { flex: 1; min-width: 0; }
        .band-item-name { font-size: 13px; font-weight: 600; color: #facc15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .band-item-meta { font-size: 11px; color: var(--text-secondary); }
        .band-item-likes { font-size: 11px; color: #f43f5e; font-weight: 600; background: rgba(244, 63, 94, 0.1); padding: 2px 6px; border-radius: 6px; }

        /* 地图区及右侧悬浮详情卡片容器 */
        .map-container { flex: 1; position: relative; height: 100%; background: #090d16; }
        #chinaMap { width: 100%; height: 100%; }

        /* 右侧详情卡片 */
        .detail-card {
            position: absolute; right: 24px; top: 24px; width: 260px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
            padding: 20px; text-align: center; color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 100;
            display: none; /* 默认隐藏，有选中时显示 */
        }
        .detail-card.show { display: block; }
        
        /* 关闭按钮 */
        .close-btn {
            position: absolute; top: 12px; right: 14px;
            background: transparent; border: none; color: var(--text-secondary);
            font-size: 14px; cursor: pointer; padding: 4px;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #fff; }

        .card-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px auto; border: 2px solid #38bdf8; display: block; }
        .card-name { font-size: 16px; font-weight: 700; color: #facc15; margin-bottom: 6px; }
        .card-style { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #e2e8f0; font-size: 11px; padding: 2px 10px; border-radius: 10px; display: inline-block; margin-bottom: 6px; }
        .card-city { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185); border: none; color: white;
            font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 20px; cursor: pointer; width: 100%;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4); transition: opacity 0.2s;
        }
        .like-btn:hover { opacity: 0.9; }
        .like-count-display { font-size: 12px; color: #f43f5e; margin-top: 10px; font-weight: 600; }

        .footer-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 36px;
            display: flex; justify-content: center; align-items: center; padding: 0 16px;
            background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(8px); z-index: 1000;
            border-top: 1px solid var(--border-color); font-size: 11px; color: var(--text-secondary);
        }
        .footer-bar span { color: var(--accent-color); font-weight: 500; margin-left: 4px; }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="site-title">🎸 中国独立乐队地图</div>
        <div class="user-quota" id="quotaDisplay">今日剩余点赞: 10/10</div>
    </header>

    <div class="main-layout">
        <div class="sidebar">
            <div class="search-box-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索乐队、城市、风格...">
            </div>
            <div class="rank-section-title">🔥 获赞热度排行榜</div>
            <div class="band-list" id="bandList"></div>
        </div>
        
        <div class="map-container">
            <div id="chinaMap"></div>
            <!-- 右侧详情与点赞卡片 -->
            <div class="detail-card" id="detailCard">
                <button class="close-btn" onclick="closeDetailCard()">❌</button>
                <div id="cardContent"></div>
            </div>
        </div>
    </div>

    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBands = [];
        let currentSelectedBand = null;
        const myChart = echarts.init(document.getElementById('chinaMap'));

        function checkAndGetQuota() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let record = JSON.parse(localStorage.getItem('band_like_quota') || '{}');
            if (record.date !== todayStr) {
                record = { date: todayStr, count: 10 };
                localStorage.setItem('band_like_quota', JSON.stringify(record));
            }
            return record.count;
        }

        function updateQuotaDisplay() {
            document.getElementById('quotaDisplay').innerText = `今日剩余点赞: ${checkAndGetQuota()}/10`;
        }

        async function fetchBands() {
            const { data, error } = await supabaseClient.from('bands').select('*').order('likes', { ascending: false });
            if (error) { console.error(error); return; }
            allBands = data || [];
            renderUI(allBands);
            if (allBands.length > 0) {
                selectBand(allBands[0]);
            }
        }

        function renderUI(bands) {
            updateQuotaDisplay();
            renderList(bands);
            renderMap(bands);
        }

        function selectBand(band) {
            currentSelectedBand = band;
            
            document.querySelectorAll('.band-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id == band.id);
            });

            const card = document.getElementById('detailCard');
            const content = document.getElementById('cardContent');
            card.classList.add('show');
            
            content.innerHTML = `
                <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="card-avatar">
                <div class="card-name">${band.name}</div>
                <div class="card-style">${band.style || '独立音乐'}</div>
                <div class="card-city">📍 ${band.city}</div>
                <button class="like-btn" onclick="handleLike(${band.id})">送心心💗</button>
                <div class="like-count-display">获得: <span id="like-count-${band.id}">${band.likes || 0}</span> 💗</div>
            `;
        }

        window.closeDetailCard = function() {
            document.getElementById('detailCard').classList.remove('show');
            currentSelectedBand = null;
            document.querySelectorAll('.band-item').forEach(el => el.classList.remove('active'));
        }

        function renderList(bands) {
            const listEl = document.getElementById('bandList');
            listEl.innerHTML = '';
            bands.forEach((band, index) => {
                const item = document.createElement('div');
                item.className = `band-item ${currentSelectedBand && currentSelectedBand.id === band.id ? 'active' : ''}`;
                item.dataset.id = band.id;
                item.innerHTML = `
                    <div class="band-rank-num">${index + 1}</div>
                    <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="band-item-avatar">
                    <div class="band-item-info">
                        <div class="band-item-name">${band.name}</div>
                        <div class="band-item-meta">${band.city} · ${band.style || ''}</div>
                    </div>
                    <div class="band-item-likes">💗 ${band.likes || 0}</div>
                `;
                item.addEventListener('click', () => {
                    selectBand(band);
                });
                listEl.appendChild(item);
            });
        }

        function renderMap(bands) {
            const scatterData = bands.map(band => ({
                name: band.name,
                value: [band.longitude, band.latitude, band.likes || 0],
                bandInfo: band
            }));

            const option = {
                backgroundColor: '#090d16',
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: 1.2,
                    itemStyle: {
                        areaColor: '#1e293b',
                        borderColor: '#475569',
                        borderWidth: 1.2
                    },
                    emphasis: {
                        itemStyle: { areaColor: '#334155' }
                    }
                },
                series: [{
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    data: scatterData,
                    symbolSize: function (val) {
                        return Math.min(10 + Math.sqrt(val[2]) * 2, 22);
                    },
                    itemStyle: {
                        color: '#38bdf8',
                        shadowBlur: 8,
                        shadowColor: '#38bdf8'
                    },
                    emphasis: {
                        itemStyle: { color: '#facc15', borderColor: '#fff', borderWidth: 2 }
                    }
                }]
            };
            myChart.setOption(option);
        }

        myChart.on('click', function (params) {
            if (params.data && params.data.bandInfo) {
                selectBand(params.data.bandInfo);
            }
        });

        window.handleLike = async function(bandId) {
            let record = JSON.parse(localStorage.getItem('band_like_quota') || '{}');
            if (record.count <= 0) {
                alert('⏰ 今日 10 次送心心机会已用完，请明天再来为喜欢的乐队打Call！');
                return;
            }
            record.count -= 1;
            localStorage.setItem('band_like_quota', JSON.stringify(record));
            updateQuotaDisplay();

            const band = allBands.find(b => b.id === bandId);
            const newLikes = (band.likes || 0) + 1;
            await supabaseClient.from('bands').update({ likes: newLikes }).eq('id', bandId);

            band.likes = newLikes;
            allBands.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            const span = document.getElementById(`like-count-${bandId}`);
            if (span) span.innerText = newLikes;
            renderList(allBands);
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase().trim();
            const filtered = allBands.filter(b => 
                b.name.toLowerCase().includes(kw) || 
                b.city.toLowerCase().includes(kw) || 
                (b.style && b.style.toLowerCase().includes(kw))
            );
            renderList(filtered);
            renderMap(filtered);
        });

        window.addEventListener('resize', () => myChart.resize());
        fetchBands();
    </script>
</body>
</html>
