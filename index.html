<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    
    <!-- 引入 Leaflet 地图样式与 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.92);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        /* 顶部导航条 */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-quota {
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* 主体布局 */
        .main-layout {
            position: absolute;
            top: 56px;
            bottom: 36px;
            left: 0;
            width: 100%;
            display: flex;
        }

        /* 左侧面板 */
        .sidebar {
            width: 340px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 999;
        }

        .search-box-container {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .rank-section-title {
            padding: 8px 16px 4px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #facc15;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .band-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px 12px;
        }

        .band-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .band-item:hover, .band-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .band-rank-num {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            width: 18px;
            text-align: center;
        }
        .band-item:nth-child(1) .band-rank-num { color: #f59e0b; }
        .band-item:nth-child(2) .band-rank-num { color: #94a3b8; }
        .band-item:nth-child(3) .band-rank-num { color: #b45309; }

        .band-item-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-color);
        }

        .band-item-info {
            flex: 1;
            min-width: 0;
        }

        .band-item-name {
            font-size: 13px;
            font-weight: 600;
            color: #facc15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .band-item-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .band-item-likes {
            font-size: 11px;
            color: #f43f5e;
            font-weight: 600;
            background: rgba(244, 63, 94, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 右侧地图容器 */
        #map {
            flex: 1;
            height: 100%;
            background: #090d16;
            z-index: 1;
        }

        /* 底部标语栏 */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .footer-bar span {
            color: var(--accent-color);
            font-weight: 500;
            margin-left: 4px;
        }

        /* Leaflet 弹窗暗黑美化 */
        .leaflet-popup-content-wrapper {
            background: var(--panel-bg) !important;
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px !important;
            color: #fff !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
        }
        .leaflet-popup-tip {
            background: var(--panel-bg) !important;
        }

        .popup-content {
            text-align: center;
            padding: 6px;
            width: 180px;
        }
        .popup-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            border: 2px solid var(--accent-color);
            display: block;
        }
        .popup-name {
            font-size: 15px;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 4px;
        }
        .popup-style {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .popup-city {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            border: none;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        .like-btn:hover {
            opacity: 0.9;
        }
        .like-count-display {
            font-size: 11px;
            color: #f43f5e;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="site-title">🎸 中国独立乐队地图</div>
        <div class="user-quota" id="quotaDisplay">今日剩余点赞: 10/10</div>
    </header>

    <div class="main-layout">
        <!-- 左侧：搜索 + 排行榜 -->
        <div class="sidebar">
            <div class="search-box-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索乐队、城市、风格...">
            </div>
            <div class="rank-section-title">🔥 获赞热度排行榜</div>
            <div class="band-list" id="bandList"></div>
        </div>

        <!-- 右侧：绝对稳定的地图容器 -->
        <div id="map"></div>
    </div>

    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

    <script>
        // ==========================================
        // 1. 配置你的 Supabase 信息
        // ==========================================
        const SUPABASE_URL = '你的Supabase项目URL'; 
        const SUPABASE_ANON_KEY = '你的Supabase匿名API密匙(anon key)';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 初始化地图，中心对准中国
        const map = L.map('map', { zoomControl: false }).setView([35.0, 105.0], 4);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 加载暗黑科技感地图底图
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let allBands = [];
        let markersList = [];

        // ==========================================
        // 2. 点赞额度（自然日计算）
        // ==========================================
        function checkAndGetQuota() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let record = JSON.parse(localStorage.getItem('band_like_quota') || '{}');
            if (record.date !== todayStr) {
                record = { date: todayStr, count: 10 };
                localStorage.setItem('band_like_quota', JSON.stringify(record));
            }
            return record.count;
        }

        function updateQuotaDisplay() {
            document.getElementById('quotaDisplay').innerText = `今日剩余点赞: ${checkAndGetQuota()}/10`;
        }

        // ==========================================
        // 3. 加载数据与渲染
        // ==========================================
        async function fetchBands() {
            const { data, error } = await supabaseClient
                .from('bands')
                .select('*')
                .order('likes', { ascending: false });

            if (error) {
                console.error('加载失败:', error);
                return;
            }
            allBands = data || [];
            renderUI(allBands);
        }

        function renderUI(bands) {
            updateQuotaDisplay();
            renderList(bands);
            renderMapMarkers(bands);
        }

        // 渲染左侧列表
        function renderList(bands) {
            const listEl = document.getElementById('bandList');
            listEl.innerHTML = '';

            bands.forEach((band, index) => {
                const item = document.createElement('div');
                item.className = 'band-item';
                item.innerHTML = `
                    <div class="band-rank-num">${index + 1}</div>
                    <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="band-item-avatar">
                    <div class="band-item-info">
                        <div class="band-item-name">${band.name}</div>
                        <div class="band-item-meta">${band.city} · ${band.style || ''}</div>
                    </div>
                    <div class="band-item-likes">👍 ${band.likes || 0}</div>
                `;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.band-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    if (band.latitude && band.longitude) {
                        map.flyTo([band.latitude, band.longitude], 10, { duration: 1 });
                        // 找到对应 marker 并打开弹窗
                        markersList.forEach(m => {
                            if (m.bandId === band.id) m.marker.openPopup();
                        });
                    }
                });

                listEl.appendChild(item);
            });
        }

        // 渲染地图 Marker
        function renderMapMarkers(bands) {
            // 清除旧 marker
            markersList.forEach(item => map.removeLayer(item.marker));
            markersList = [];

            bands.forEach(band => {
                if (!band.latitude || !band.longitude) return;

                const marker = L.marker([band.latitude, band.longitude]).addTo(map);

                const popupHtml = `
                    <div class="popup-content">
                        <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="popup-avatar">
                        <div class="popup-name">${band.name}</div>
                        <div class="popup-style">${band.style || '独立音乐'}</div>
                        <div class="popup-city">📍 ${band.city}</div>
                        <button class="like-btn" onclick="handleLike(${band.id})">❤️ 为TA点赞</button>
                        <div class="like-count-display">获赞: <span id="like-count-${band.id}">${band.likes || 0}</span> 票</div>
                    </div>
                `;
                marker.bindPopup(popupHtml);
                markersList.push({ bandId: band.id, marker });
            });
        }

        // ==========================================
        // 4. 点赞处理
        // ==========================================
        window.handleLike = async function(bandId) {
            let record = JSON.parse(localStorage.getItem('band_like_quota'));
            if (record.count <= 0) {
                alert('⏰ 今日 10 次点赞机会已用完，请明天再来为喜欢的乐队打Call！');
                return;
            }

            record.count -= 1;
            localStorage.setItem('band_like_quota', JSON.stringify(record));
            updateQuotaDisplay();

            const band = allBands.find(b => b.id === bandId);
            const newLikes = (band.likes || 0) + 1;

            await supabaseClient.from('bands').update({ likes: newLikes }).eq('id', bandId);

            band.likes = newLikes;
            allBands.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            const span = document.getElementById(`like-count-${bandId}`);
            if (span) span.innerText = newLikes;

            renderList(allBands);
        };

        // 搜索筛选
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase().trim();
            const filtered = allBands.filter(b => 
                b.name.toLowerCase().includes(kw) || 
                b.city.toLowerCase().includes(kw) || 
                (b.style && b.style.toLowerCase().includes(kw))
            );
            renderList(filtered);
            renderMapMarkers(filtered);
        });

        fetchBands();
    </script>
</body>
</html>
