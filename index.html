<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    
    <!-- 如果你原本使用了 Leaflet 或其他地图 CDN，请在这里保留你的 CSS 链接 -->
    <!-- 例如: <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" /> -->

    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(20, 27, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止页面整体滚动，由地图接管全屏 */
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
        }

        /* 真实地图容器：撑满全屏并放在底层 */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 顶部导航条样式 */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: linear-gradient(to bottom, rgba(9, 13, 22, 0.9), rgba(9, 13, 22, 0.4));
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            pointer-events: auto;
        }

        .site-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 底部标语/版权样式 */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: auto;
        }

        .footer-bar span {
            color: #38bdf8;
            font-weight: 500;
            margin-left: 4px;
        }

        /* 地图弹窗样式（适配你地图库生成的弹出层或自定义弹窗） */
        .band-popup {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
            color: var(--text-main);
            width: 280px;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: rotate(90deg);
        }

        /* 头像样式：完美的圆形头像并带有流光边框 */
        .band-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 12px auto;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* 乐队头部信息 */
        .band-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .band-name {
            font-size: 18px;
            font-weight: 700;
            color: #facc15;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .band-style {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(192, 132, 252, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* 城市样式 */
        .band-city {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 顶部导航条 -->
    <header class="header-bar">
        <div class="site-title">🎸 独立乐队地图</div>
    </header>

    <!-- 真实地图容器（地图正常渲染在这里面） -->
    <div id="map"></div>

    <!-- 底部版权标语栏 -->
    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

    <!-- 如果你原本有引入 Supabase JS SDK 或 地图逻辑脚本，请放在下方 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
    <script>
        // 在这里写你原本初始化地图、连接 Supabase 并加载乐队数据的 JS 代码
        // 例如：
        // const map = L.map('map').setView([35.0, 105.0], 4);
        // ... 你的其他地图逻辑
    </script>
</body>
</html>
