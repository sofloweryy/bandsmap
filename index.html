<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国音乐地图 - 乐队分布</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图 JSON 数据 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #0b0f19;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* 地图画布全屏铺满 */
        #main {
            width: 100%;
            height: 100%;
        }
        /* 对应你截图右上角的乐队信息浮动卡片 */
        .band-card {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background-color: rgba(19, 28, 46, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            color: #ffffff;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .band-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .band-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }
        .band-info h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #f8fafc;
        }
        .band-tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .band-desc {
            font-size: 13px; 
            color: #94a3b8; 
            line-height: 1.5;
        }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
            transition: all 0.2s;
        }
        .like-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <!-- 地图容器 -->
    <div id="main"></div>

    <!-- 右上角乐队信息悬浮窗 -->
    <div class="band-card">
        <div class="band-header">
            <img class="band-avatar" src="https://picsum.photos/200/200?random=74" alt="乐队头像">
            <div class="band-info">
                <h3>棱镜乐队</h3>
                <span class="band-tag">流行摇滚 / 独立流行</span>
            </div>
        </div>
        <div class="band-desc">
            📍 坐标：四川·成都<br>
            🎸 风格：温柔清澈的流行独立乐队，治愈人心。
        </div>
        <button class="like-btn">❤️ 送出小心心 (点赞)</button>
    </div>

    <script>
        // 初始化 ECharts 地图实例
        var myChart = echarts.init(document.getElementById('main'));

        var option = {
            backgroundColor: '#0b0f19', // 科技暗色风背景
            tooltip: {
                trigger: 'item',
                formatter: function (params) {
                    return params.name ? `<div style="padding:4px;"><b>${params.name}</b> 音乐地图</div>` : '';
                }
            },
            geo: {
                map: 'china',
                roam: true, // 支持鼠标缩放和平移拖拽
                zoom: 1.2,
                itemStyle: {
                    areaColor: '#131c2e',  // 省份默认底色
                    borderColor: '#1e293b', // 省份网格边界线
                    borderWidth: 1
                },
                // 鼠标悬停时的省份与文字炫酷样式
                emphasis: {
                    itemStyle: {
                        areaColor: '#1d4ed8', // 悬停高亮蓝
                        borderColor: '#60a5fa',
                        borderWidth: 1.5
                    },
                    label: {
                        show: true,              // 开启悬停显示省份文字
                        color: '#ffffff',         // 纯白明亮字体
                        fontSize: 14,             // 字体大小适中
                        fontWeight: 'bold',       // 字体加粗
                        fontFamily: 'sans-serif',
                        textShadowColor: 'rgba(0, 0, 0, 0.9)', // 黑色立体阴影
                        textShadowBlur: 6,        // 阴影模糊扩散
                        textShadowOffsetX: 1,     // 阴影偏移
                        textShadowOffsetY: 1
                    }
                },
                // 点击选中时的省份与文字样式
                select: {
                    itemStyle: {
                        areaColor: '#2563eb', // 选中时的深蓝色
                        borderColor: '#93c5fd',
                        borderWidth: 2
                    },
                    label: {
                        show: true,              // 开启选中显示省份文字
                        color: '#ffffff',
                        fontSize: 15,
                        fontWeight: 'bold',
                        textShadowColor: 'rgba(0, 0, 0, 0.9)',
                        textShadowBlur: 6
                    }
                }
            },
            series: [
                {
                    name: '乐队分布',
                    type: 'map',
                    geoIndex: 0,
                    data: [] // 后续如果需要动态传省份热度或数据，可在此处填充
                }
            ]
        };

        myChart.setOption(option);

        // 窗口大小改变时自动适配自适应
        window.addEventListener('resize', function () {
            myChart.resize();
        });
    </script>
</body>
</html>
