<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(20, 27, 45, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
        }

        /* 顶部导航条样式 */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: linear-gradient(to bottom, rgba(9, 13, 22, 0.9), rgba(9, 13, 22, 0.4));
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 底部标语/版权样式 */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer-bar span {
            color: #38bdf8;
            font-weight: 500;
            margin-left: 4px;
        }

        /* 弹窗高级感玻璃拟态微动效设计 */
        .band-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 88%;
            max-width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
            z-index: 1000;
            animation: popupFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popupFadeIn {
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* 关闭按钮交互 */
        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: rotate(90deg);
        }

        /* 头像样式：完美的圆形头像并带有流光边框 */
        .band-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 14px auto;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* 乐队头部信息 */
        .band-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .band-name {
            font-size: 20px;
            font-weight: 700;
            color: #facc15;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .band-style {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(192, 132, 252, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* 城市样式 */
        .band-city {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <!-- 顶部导航条 -->
    <header class="header-bar">
        <div class="site-title">🎸 独立乐队地图</div>
    </header>

    <!-- 地图或主容器区域占位（实际按你原有的地图SDK初始化即可） -->
    <div id="map-container" style="width: 100%; height: 100%;"></div>

    <!-- 弹窗示例（供渲染参考） -->
    <div class="band-popup">
        <button class="close-btn">&times;</button>
        
        <!-- 精致圆形头像 -->
        <img src="https://picsum.photos/id/1082/200/200" alt="乐队头像" class="band-avatar">
        
        <div class="band-header">
            <h2 class="band-name">痛仰</h2>
            <span class="band-style">另类摇滚 / 硬摇滚</span>
        </div>
        
        <p class="band-city">📍 北京</p>
    </div>

    <!-- 底部版权标语栏 -->
    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

</body>
</html>
