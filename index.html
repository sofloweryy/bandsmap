<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>独立乐队图鉴</title>
    <!-- 引入 ECharts 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 引入中国地图标准 JSON 数据 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }

        /* 左侧窄版乐队列表侧边栏 */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: rgba(13, 18, 30, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
        }
        /* 顶部剩余小心心胶囊 */
        .global-heart-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .global-heart-badge span {
            color: #fb7185;
            font-weight: 600;
        }
        /* 搜索框样式 */
        .search-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        .search-box:focus {
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .search-box::placeholder {
            color: #64748b;
        }

        .band-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .band-list-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .band-list-item:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateX(2px);
        }
        .band-list-item.active {
            background: rgba(37, 99, 235, 0.25);
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .band-list-item .item-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-likes {
            font-size: 12px;
            color: #fb7185;
            font-weight: 600;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 3px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .item-likes svg {
            width: 12px;
            height: 12px;
            fill: #fb7185;
        }

        /* 中间主地图容器 */
        #map-container {
            flex: 1;
            height: 100vh;
        }

        /* 底部版权与作者信息栏 */
        .footer-banner {
            position: absolute;
            bottom: 12px;
            left: 260px;
            right: 24px;
            background: rgba(13, 18, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            backdrop-filter: blur(6px);
            z-index: 15;
            pointer-events: none;
        }

        /* 右上角乐队信息面板（默认隐藏） */
        .band-card {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 330px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(12px);
            z-index: 20;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 14px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        .card-meta h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .card-tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .card-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
        }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .like-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .like-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- 左侧窄版乐队列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <span>🎸 乐队图鉴</span>
            </div>
            <!-- 顶部剩余小心心 -->
            <div class="global-heart-badge">
                今日剩余小心心：<span id="remainingHearts">100</span> / 100
            </div>
            <!-- 搜索框：支持搜名字、地区、风格 -->
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索乐队、地区、风格..." oninput="handleSearch()">
        </div>
        <div class="band-list" id="bandList">
            <!-- 动态渲染 -->
        </div>
    </div>

    <!-- 中间地图区域 -->
    <div id="map-container"></div>

    <!-- 底部版权和交流提示 -->
    <div class="footer-banner">
        仅供娱乐切勿较真儿 | 欢迎乐迷交流指正 ｜ 联系美丽且智慧的开发者 公众号：摘花花 ｜ 邮箱：zhaihuahua1701@gmail.com
    </div>

    <!-- 右上角乐队信息面板（默认隐藏） -->
    <div class="band-card" id="bandCard">
        <div class="card-header">
            <img class="card-avatar" id="cardAvatar" src="https://picsum.photos/200/200?random=1" alt="头像">
            <div class="card-meta">
                <h3 id="cardName">请选择乐队</h3>
                <span class="card-tag" id="cardStyle">-</span>
            </div>
        </div>
        <div class="card-desc" id="cardDesc">
            📍 坐标：请点击左侧列表或地图上的点<br>✨ 简介：查看乐队详细信息
        </div>
        <button class="like-btn" id="likeBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            送出小心心 ( <span id="likeCount">0</span> )
        </button>
    </div>

    <script>
        // ==========================================
        // 1. Supabase 配置
        // ==========================================
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let bandDatabase = [];
        let currentActiveId = null;
        var myChart = null;

        // 每天 100 个小心心本地配额管理
        let remainingHearts = 100;
        const todayKey = 'band_map_hearts_' + new Date().toDateString();
        const savedHearts = localStorage.getItem(todayKey);
        if (savedHearts !== null) {
            remainingHearts = parseInt(savedHearts, 10);
        }

        // 常用城市经纬度对照表
        const cityCoords = {
            '北京': [116.40, 39.90],
            '上海': [121.47, 31.23],
            '广州': [113.26, 23.12],
            '深圳': [114.05, 22.54],
            '成都': [104.06, 30.57],
            '西安': [108.93, 34.34],
            '台北': [121.50, 25.03],
            '宜兰': [121.76, 24.75],
            '石家庄': [114.48, 38.03],
            '武汉': [114.30, 30.59],
            '杭州': [120.15, 30.27],
            '重庆': [106.55, 29.56],
            '长沙': [112.93, 28.22],
            '海丰': [115.32, 22.96],
            '青岛': [120.38, 36.06],
            '南京': [118.79, 32.06],
            '厦门': [118.08, 24.47]
        };

        // ==========================================
        // 2. 从 Supabase 加载数据并处理
        // ==========================================
        async function fetchBandsFromSupabase() {
            try {
                const { data, error } = await _supabase.from('bands').select('*');
                
                if (error) {
                    console.error('加载 Supabase 数据失败:', error);
                    return;
                }

                if (data && data.length > 0) {
                    bandDatabase = processCoordinates(data);
                    sortAndRenderSidebar();
                    initMap(bandDatabase);
                    updateHeartDisplay();
                }
            } catch (err) {
                console.error('网络异常:', err);
            }
        }

        // 匹配经纬度，并对同城市/同坐标点做黄金角螺旋发散防重叠
        function processCoordinates(list) {
            const coordMap = {};
            return list.map(band => {
                let lng = 104.06;
                let lat = 30.57;

                if (band.lng && !isNaN(band.lng) && band.lat && !isNaN(band.lat)) {
                    lng = Number(band.lng);
                    lat = Number(band.lat);
                } else if (band.city && cityCoords[band.city]) {
                    lng = cityCoords[band.city][0];
                    lat = cityCoords[band.city][1];
                } else if (band.province && cityCoords[band.province]) {
                    lng = cityCoords[band.province][0];
                    lat = cityCoords[band.province][1];
                }

                const key = `${lng.toFixed(2)}_${lat.toFixed(2)}`;
                if (coordMap[key] === undefined) {
                    coordMap[key] = 0;
                } else {
                    coordMap[key]++;
                    const angle = coordMap[key] * 137.5 * (Math.PI / 180); 
                    const radius = 0.08 * Math.sqrt(coordMap[key]);
                    lng += radius * Math.cos(angle);
                    lat += radius * Math.sin(angle);
                }

                return { ...band, lng, lat, likes: band.likes || 0 };
            });
        }

        function handleSearch() {
            sortAndRenderSidebar();
        }

        // 按点赞总数排序并渲染左侧列表
        function sortAndRenderSidebar() {
            bandDatabase.sort((a, b) => b.likes - a.likes);

            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const filteredList = bandDatabase.filter(band => {
                if (!keyword) return true;
                const nameMatch = band.name && band.name.toLowerCase().includes(keyword);
                const provinceMatch = band.province && band.province.toLowerCase().includes(keyword);
                const cityMatch = band.city && band.city.toLowerCase().includes(keyword);
                const styleMatch = band.style && band.style.toLowerCase().includes(keyword);
                return nameMatch || provinceMatch || cityMatch || styleMatch;
            });

            const listContainer = document.getElementById('bandList');
            listContainer.innerHTML = '';
            
            filteredList.forEach(band => {
                const globalIndex = bandDatabase.findIndex(b => b.id === band.id);

                const item = document.createElement('div');
                item.className = `band-list-item ${band.id === currentActiveId ? 'active' : ''}`;
                
                let likesHTML = '';
                if (globalIndex < 10) {
                    likesHTML = `
                        <div class="item-likes">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            ${band.likes}
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div class="item-name">${band.name}</div>
                    ${likesHTML}
                `;
                item.onclick = () => {
                    currentActiveId = band.id;
                    sortAndRenderSidebar();
                    showCardContent(band);
                    
                    // 地图高亮对应的省份区域
                    if (myChart && band.province) {
                        myChart.dispatchAction({
                            type: 'highlight',
                            name: band.province
                        });
                    }
                };
                listContainer.appendChild(item);
            });
        }

        // 选中乐队后展示右侧卡片并填充内容
        function showCardContent(band) {
            const card = document.getElementById('bandCard');
            card.style.display = 'flex';

            document.getElementById('cardName').innerText = band.name;
            document.getElementById('cardStyle').innerText = band.style || '独立音乐';
            document.getElementById('cardDesc').innerHTML = `📍 坐标：${band.province || ''}·${band.city || ''}<br>✨ 简介：${band.desc || '暂无简介'}`;
            document.getElementById('cardAvatar').src = band.avatar || `https://picsum.photos/200/200?random=${band.id}`;
            document.getElementById('likeCount').innerText = band.likes;
            
            updateHeartDisplay();
        }

        function updateHeartDisplay() {
            document.getElementById('remainingHearts').innerText = remainingHearts;
            const btn = document.getElementById('likeBtn');
            if (remainingHearts <= 0) {
                btn.disabled = true;
                btn.innerText = '今日小心心已送完';
            } else {
                btn.disabled = false;
            }
        }

        // 点赞交互
        document.getElementById('likeBtn').onclick = async () => {
            if (remainingHearts <= 0) return;

            remainingHearts--;
            localStorage.setItem(todayKey, remainingHearts);
            updateHeartDisplay();

            const currentBand = bandDatabase.find(b => b.id === currentActiveId);
            if (currentBand) {
                currentBand.likes += 1;
                document.getElementById('likeCount').innerText = currentBand.likes;

                sortAndRenderSidebar();

                try {
                    await _supabase
                        .from('bands')
                        .update({ likes: currentBand.likes })
                        .eq('id', currentBand.id);
                } catch (e) {
                    console.error('点赞同步数据库失败', e);
                }
            }
        };

        // ==========================================
        // 3. 初始化 ECharts 地图
        // ==========================================
        function initMap(data) {
            myChart = echarts.init(document.getElementById('map-container'));

            var scatterData = data.map(band => ({
                name: band.name,
                value: [band.lng, band.lat],
                bandObj: band
            }));

            var option = {
                backgroundColor: '#0b0f19',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        // 触碰到坐标时：只展示乐队名字
                        if (params.seriesType === 'effectScatter') {
                            return `<b>${params.data.bandObj.name}</b>`;
                        }
                        return '';
                    }
                },
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: 1.25,
                    itemStyle: {
                        areaColor: '#131c2e',
                        borderColor: '#1e293b',
                        borderWidth: 1.2
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: '#1d4ed8', 
                            borderColor: '#60a5fa',
                            borderWidth: 1.5
                        },
                        label: {
                            show: true,              
                            color: '#ffffff',         
                            fontSize: 14,             
                            fontWeight: 'bold',       
                            fontFamily: 'sans-serif',
                            textShadowColor: 'rgba(0, 0, 0, 0.95)', 
                            textShadowBlur: 8,        
                            textShadowOffsetX: 1,     
                            textShadowOffsetY: 1      
                        }
                    },
                    select: {
                        itemStyle: {
                            areaColor: '#2563eb',
                            borderColor: '#93c5fd',
                            borderWidth: 2
                        },
                        label: {
                            show: true,              
                            color: '#ffffff',
                            fontSize: 15,
                            fontWeight: 'bold',
                            textShadowColor: 'rgba(0, 0, 0, 0.95)',
                            textShadowBlur: 8
                        }
                    }
                },
                series: [
                    {
                        name: '地图背景',
                        type: 'map',
                        geoIndex: 0,
                        data: []
                    },
                    {
                        name: '乐队动态坐标',
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        data: scatterData,
                        symbolSize: 8,
                        showEffectOn: 'render',
                        rippleEffect: {
                            brushType: 'stroke',
                            scale: 3.5,
                            period: 3
                        },
                        itemStyle: {
                            color: '#38bdf8',          
                            shadowBlur: 8,
                            shadowColor: '#38bdf8'
                        },
                        emphasis: {
                            scale: 1.6
                        }
                    }
                ]
            };

            myChart.setOption(option);

            // 地图点点击事件：点击坐标后高亮该乐队所在省份并弹出卡片
            myChart.on('click', function (params) {
                if (params.seriesType === 'effectScatter' && params.data.bandObj) {
                    const targetBand = params.data.bandObj;
                    currentActiveId = targetBand.id;
                    sortAndRenderSidebar();
                    showCardContent(targetBand);

                    if (targetBand.province) {
                        myChart.dispatchAction({
                            type: 'highlight',
                            name: targetBand.province
                        });
                    }
                }
            });
        }

        fetchBandsFromSupabase();

        window.addEventListener('resize', function () {
            if (myChart) myChart.resize();
        });
    </script>
</body>
</html>
