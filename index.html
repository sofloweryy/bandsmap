    <!-- 引入 Supabase 客户端 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>

        }
        .sidebar-title-row {

        .sidebar-title-row .icon-badge {

        .global-heart-badge {

            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 7px 12px;

        .card-header {

        }

        .card-meta {

            flex: 1;

        .card-meta h3 {

        .card-info-row {

            border-radius: 10px;

            body {
                flex-direction: column;

                display: none;
                width: 100vw;

                top: 54px;

            .sidebar.mobile-show {
                display: flex;
            }
            #map-container {
                display: block;
                width: 100vw;
                height: calc(100vh - 54px);
                position: absolute;
                top: 54px;
                left: 0;
            }
            #map-container.mobile-hide {
                display: none;
            }
            .footer-banner {
                display: none;
            }
            .mobile-top-nav {
                display: flex;
                width: 100vw;
                height: 54px;
                background: rgba(13, 18, 30, 0.98);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                position: absolute;
                top: 0;
                left: 0;
                z-index: 30;
                align-items: center;
                justify-content: space-around;

            .mobile-tab-btn {
                flex: 1;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: 14px;
                font-weight: 600;
                color: #94a3b8;
                background: transparent;
                border: none;
                cursor: pointer;
                transition: all 0.2s;
                position: relative;
            }
            .mobile-tab-btn.active {

            }
            .mobile-tab-btn.active::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 20%;
                right: 20%;

                background: #3b82f6;
                border-radius: 3px 3px 0 0;

                right: 16px;
                left: 16px;
                width: auto;
            }

        ::-webkit-scrollbar {

            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="mobile-top-nav">
        <button class="mobile-tab-btn active" id="tabMapBtn" onclick="switchMobileTab('map')">
            🗺️ 地图模式
        </button>
        <button class="mobile-tab-btn" id="tabListBtn" onclick="switchMobileTab('list')">
            📋 乐队列表
        </button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <div class="icon-badge">🎸</div>

            </div>

                今日剩余小心心：<span id="remainingHearts">200</span> / 200
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索乐队、地区、风格..." oninput="handleSearch()">
        </div>
        <div class="band-list" id="bandList"></div>

    <div id="map-container"></div>

    <div class="footer-banner">
        仅供娱乐切勿较真儿 | 欢迎乐迷交流指正 ｜ 联系美丽且智慧的开发者 公众号：摘花花 ｜ 邮箱：zhaihuahua1701@gmail.com
    </div>

    <div class="band-card" id="bandCard">

            <img class="card-avatar" id="cardAvatar" src="https://picsum.photos/200/200?random=1" alt="头像">
            <div class="card-meta">
                <h3 id="cardName">请选择乐队</h3>

                    <span class="card-tag" id="cardStyle">-</span>

                </div>
            </div>

            送心心 ❤️‍🔥 ( <span id="likeCount">0</span> )

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let bandDatabase = [];
        let currentActiveId = null;
        var myChart = null;

        const MAX_HEARTS = 200;
        let remainingHearts = MAX_HEARTS;
        const todayKey = 'band_map_hearts_200_' + new Date().toDateString();
        const savedHearts = localStorage.getItem(todayKey);
        if (savedHearts !== null) {
            remainingHearts = parseInt(savedHearts, 10);
        }

        function switchMobileTab(mode) {
            const mapContainer = document.getElementById('map-container');
            const sidebar = document.getElementById('sidebar');
            const tabMapBtn = document.getElementById('tabMapBtn');
            const tabListBtn = document.getElementById('tabListBtn');

            if (mode === 'map') {
                tabMapBtn.classList.add('active');
                tabListBtn.classList.remove('active');
                mapContainer.classList.remove('mobile-hide');
                sidebar.classList.remove('mobile-show');
                if (myChart) myChart.resize();
            } else {
                tabListBtn.classList.add('active');
                tabMapBtn.classList.remove('active');
                mapContainer.classList.add('mobile-hide');
                sidebar.classList.add('mobile-show');
            }
        }

        function closeCard() {
            document.getElementById('bandCard').style.display = 'none';
        }

        // 精准扩充并核对各主要城市与省份坐标（重点补全河北省内及各摇滚重镇）
        const cityCoords = {
            // 河北省及核心城市
            '石家庄': [114.51485, 38.04276],
            '河北': [114.51485, 38.04276],

            '唐山': [118.175393, 39.635113],
            '秦皇岛': [119.60052, 39.93538],

            '承德': [117.96255, 40.94537],

            // 其他重点城市与省份
            '北京': [116.405285, 39.904989],

            '广东': [113.264434, 23.129162],

            '陕西': [108.93984, 34.34127],
            '杭州': [120.153576, 30.287459],
            '浙江': [120.153576, 30.287459],
            '南京': [118.796877, 32.060255],
            '江苏': [118.796877, 32.060255],
            '武汉': [114.298572, 30.584355],
            '湖北': [114.298572, 30.584355],
            '长沙': [112.938877, 28.228209],
            '湖南': [112.938877, 28.228209],
            '青岛': [120.384428, 36.066227],
            '山东': [117.000923, 36.675807],

            '福建': [119.306239, 26.075302],
            '福州': [119.306239, 26.075302],
            '昆明': [102.712251, 25.040609],
            '云南': [102.712251, 25.040609],
            '贵阳': [106.63024, 26.64766],
            '贵州': [106.63024, 26.64766],
            '兰州': [103.823557, 36.058039],
            '甘肃': [103.823557, 36.058039],
            '哈尔滨': [126.642464, 45.756967],
            '黑龙江': [126.642464, 45.756967],
            '沈阳': [123.429096, 41.796767],
            '辽宁': [123.429096, 41.796767],
            '长春': [125.3245, 43.81707],
            '吉林': [125.3245, 43.81707],
            '乌鲁木齐': [87.617733, 43.792818],
            '新疆': [87.617733, 43.792818],
            '呼和浩特': [111.75109, 40.8418],
            '内蒙古': [111.75109, 40.8418],
            '台北': [121.5654, 25.033],
            '台湾': [120.9605, 23.6978]
        };

        async function fetchBandsFromSupabase() {
            try {
                const { data, error } = await _supabase.from('bands').select('*');
                if (error) {
                    console.error('加载 Supabase 数据失败:', error);
                    return;
                }
                if (data && data.length > 0) {
                    bandDatabase = processCoordinates(data);
                    sortAndRenderSidebar();
                    initMap(bandDatabase);
                    updateHeartDisplay();
                }
            } catch (err) {
                console.error('网络异常:', err);
            }
        }

        function processCoordinates(list) {
            const locationGroups = {};
            list.forEach(band => {
                let lng = 104.0657;
                let lat = 30.5723;

                // 严格匹配优先级：1. 乐队自带经纬度 -> 2. 城市匹配 -> 3. 省份匹配
                if (band.lng && !isNaN(band.lng) && band.lat && !isNaN(band.lat)) {
                    lng = Number(band.lng);
                    lat = Number(band.lat);
                } else if (band.city && cityCoords[band.city]) {
                    lng = cityCoords[band.city][0];
                    lat = cityCoords[band.city][1];
                } else if (band.province && cityCoords[band.province]) {
                    lng = cityCoords[band.province][0];
                    lat = cityCoords[band.province][1];
                }

                const groupKey = band.city || band.province || 'default';
                if (!locationGroups[groupKey]) {
                    locationGroups[groupKey] = { baseLng: lng, baseLat: lat, items: [] };
                }
                locationGroups[groupKey].items.push(band);
            });

            const processedList = [];
            Object.keys(locationGroups).forEach(key => {
                const group = locationGroups[key];
                group.items.forEach((band, index) => {
                    let finalLng = group.baseLng;
                    let finalLat = group.baseLat;

                    // 同城市多支乐队进行微小螺旋散开，避免重叠
                    if (index > 0) {
                        const angle = index * 137.5 * (Math.PI / 180);
                        const radius = 0.28 * Math.sqrt(index); 
                        finalLng += radius * Math.cos(angle);
                        finalLat += (radius * 0.75) * Math.sin(angle);
                    }

                    processedList.push({
                        ...band,
                        lng: finalLng,
                        lat: finalLat,
                        likes: band.likes || 0
                    });
                });
            });
            return processedList;
        }

        function handleSearch() {
            sortAndRenderSidebar();
        }

        function sortAndRenderSidebar() {
            bandDatabase.sort((a, b) => b.likes - a.likes);
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const filteredList = bandDatabase.filter(band => {
                if (!keyword) return true;
                const nameMatch = band.name && band.name.toLowerCase().includes(keyword);
                const provinceMatch = band.province && band.province.toLowerCase().includes(keyword);
                const cityMatch = band.city && band.city.toLowerCase().includes(keyword);
                const styleMatch = band.style && band.style.toLowerCase().includes(keyword);
                return nameMatch || provinceMatch || cityMatch || styleMatch;
            });

            const listContainer = document.getElementById('bandList');
            listContainer.innerHTML = '';
            
            filteredList.forEach(band => {
                const globalIndex = bandDatabase.findIndex(b => b.id === band.id);
                const item = document.createElement('div');
                item.className = `band-list-item ${band.id === currentActiveId ? 'active' : ''}`;
                
                let likesHTML = '';
                if (globalIndex < 10) {
                    likesHTML = `
                        <div class="item-likes">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            ${band.likes}
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div class="item-name">${band.name}</div>
                    ${likesHTML}
                `;
                item.onclick = () => {
                    selectBand(band.id);
                    if (window.innerWidth <= 768) {
                        switchMobileTab('map');
                    }
                };
                listContainer.appendChild(item);
            });
        }

        function selectBand(bandId) {
            currentActiveId = bandId;
            sortAndRenderSidebar();
            
            const targetBand = bandDatabase.find(b => b.id === bandId);
            if (targetBand) {
                showCardContent(targetBand);
                if (myChart) {
                    updateMapScatterData();
                    myChart.setOption({
                        geo: {
                            center: [targetBand.lng, targetBand.lat],
                            zoom: 1.8
                        }
                    });
                }
            }
        }

        function showCardContent(band) {
            const card = document.getElementById('bandCard');
            card.style.display = 'flex';

            document.getElementById('cardName').innerText = band.name;
            document.getElementById('cardStyle').innerText = band.style || '独立音乐';
            
            const locationStr = band.city ? `${band.province || ''}${band.province && band.city ? '·' : ''}${band.city}` : (band.province || '未知地区');
            document.getElementById('cardLocation').innerText = `📍 ${locationStr}`;
            
            document.getElementById('cardAvatar').src = band.avatar || `https://picsum.photos/200/200?random=${band.id}`;
            document.getElementById('likeCount').innerText = band.likes;
            
            updateHeartDisplay();
        }

        function updateHeartDisplay() {
            document.getElementById('remainingHearts').innerText = remainingHearts;
            const btn = document.getElementById('likeBtn');
            if (remainingHearts <= 0) {
                btn.disabled = true;
                btn.innerText = '今日小心心已送完';
            } else {
                btn.disabled = false;
            }
        }

        document.getElementById('likeBtn').onclick = async () => {
            if (remainingHearts <= 0) return;

            remainingHearts--;
            localStorage.setItem(todayKey, remainingHearts);
            updateHeartDisplay();

            const currentBand = bandDatabase.find(b => b.id === currentActiveId);
            if (currentBand) {
                currentBand.likes += 1;
                document.getElementById('likeCount').innerText = currentBand.likes;
                sortAndRenderSidebar();

                try {
                    await _supabase
                        .from('bands')
                        .update({ likes: currentBand.likes })
                        .eq('id', currentBand.id);
                } catch (e) {
                    console.error('点赞同步数据库失败', e);
                }
            }
        };

        function updateMapScatterData() {
            if (!myChart) return;

            var scatterData = bandDatabase.map(band => {
                const isSelected = (band.id === currentActiveId);
                return {
                    name: band.name,
                    value: [band.lng, band.lat],
                    bandObj: band,
                    symbolSize: isSelected ? 11 : 6,
                    itemStyle: {
                        color: isSelected ? '#fb7185' : '#38bdf8',
                        shadowBlur: isSelected ? 16 : 4,
                        shadowColor: isSelected ? '#f43f5e' : '#0ea5e9'
                    }
                };
            });

            myChart.setOption({
                series: [
                    {},
                    {
                        name: '乐队动态坐标',
                        data: scatterData
                    }
                ]
            });
        }

        function initMap(data) {
            myChart = echarts.init(document.getElementById('map-container'));

            var option = {
                backgroundColor: '#0b0f19',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.seriesType === 'effectScatter') {
                            return `<b>🎵 ${params.data.bandObj.name}</b>`;
                        }
                        return '';
                    }
                },
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: 1.25,
                    scaleLimit: {
                        min: 1,
                        max: 6
                    },
                    itemStyle: {
                        areaColor: '#131c2e',
                        borderColor: '#1e293b',
                        borderWidth: 1.2
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: '#1d4ed8', 
                            borderColor: '#60a5fa',
                            borderWidth: 1.5
                        },
                        label: {
                            show: true,              
                            color: '#ffffff',         
                            fontSize: 14,             
                            fontWeight: 'bold',       
                            textShadowColor: 'rgba(0, 0, 0, 0.95)', 
                            textShadowBlur: 8      
                        }
                    }
                },
                series: [
                    {
                        name: '地图背景',
                        type: 'map',
                        geoIndex: 0,
                        data: []
                    },
                    {
                        name: '乐队动态坐标',
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        data: [],
                        symbolSize: 6,
                        showEffectOn: 'render',
                        rippleEffect: {
                            brushType: 'stroke',
                            scale: 3,
                            period: 2.5
                        },
                        emphasis: {
                            scale: 2
                        }
                    }
                ]
            };

            myChart.setOption(option);
            updateMapScatterData();

            myChart.on('click', function (params) {
                if (params.seriesType === 'effectScatter' && params.data.bandObj) {
                    selectBand(params.data.bandObj.id);
                }
            });
        }

        fetchBandsFromSupabase();

        window.addEventListener('resize', function () {
            if (myChart) myChart.resize();
        });
    </script>
</body>
</html>
