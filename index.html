<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text-main); }

        .header-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 56px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 16px;
            background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(10px); z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }
        .site-title { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-quota { font-size: 11px; color: var(--text-secondary); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); }

        .mobile-tabs {
            display: none; position: absolute; top: 56px; left: 0; width: 100%; height: 40px;
            background: rgba(15, 23, 42, 0.98); border-bottom: 1px solid var(--border-color); z-index: 999;
        }
        .mobile-tab-btn {
            flex: 1; height: 100%; background: transparent; border: none; color: var(--text-secondary);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .mobile-tab-btn.active { color: #facc15; background: rgba(250, 204, 21, 0.08); border-bottom: 2px solid #facc15; }

        .main-layout { position: absolute; top: 56px; bottom: 36px; left: 0; width: 100%; display: flex; }

        .sidebar {
            width: 340px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 999;
            transition: transform 0.3s ease;
        }
        .search-box-container { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .search-input {
            width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: var(--accent-color); }

        .rank-section-title { padding: 8px 16px 4px 16px; font-size: 11px; font-weight: 600; color: #facc15; letter-spacing: 0.5px; text-transform: uppercase; }
        .band-list { flex: 1; overflow-y: auto; padding: 8px 12px; }

        .band-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s ease;
        }
        .band-item:hover, .band-item.active { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); }
        .band-rank-num { font-size: 12px; font-weight: 700; color: var(--text-secondary); width: 18px; text-align: center; }
        .band-item:nth-child(1) .band-rank-num { color: #f59e0b; }
        .band-item:nth-child(2) .band-rank-num { color: #94a3b8; }
        .band-item:nth-child(3) .band-rank-num { color: #b45309; }

        .band-item-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); }
        .band-item-info { flex: 1; min-width: 0; }
        .band-item-name { font-size: 13px; font-weight: 600; color: #facc15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .band-item-meta { font-size: 11px; color: var(--text-secondary); }
        .band-item-likes { font-size: 11px; color: #f43f5e; font-weight: 600; background: rgba(244, 63, 94, 0.1); padding: 2px 6px; border-radius: 6px; }

        .map-container { flex: 1; position: relative; height: 100%; background: #090d16; }
        #chinaMap { width: 100%; height: 100%; }

        /* 优化后的紧凑精简弹窗样式 */
        .detail-card {
            position: absolute; right: 20px; top: 20px; width: 260px;
            background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
            padding: 14px 16px; text-align: center; color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 100;
            display: none;
        }
        .detail-card.show { display: block; }
        
        .close-btn {
            position: absolute; top: 8px; right: 10px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color); 
            color: var(--text-secondary); width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .card-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin: 0 auto 6px auto; border: 2px solid #38bdf8; display: block; }
        .card-name { font-size: 15px; font-weight: 700; color: #facc15; margin-bottom: 4px; }
        .card-style { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #e2e8f0; font-size: 10px; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-bottom: 4px; }
        .card-city { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
        .like-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185); border: none; color: white;
            font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 16px; cursor: pointer; width: 100%;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4); transition: opacity 0.2s;
        }
        .like-btn:hover { opacity: 0.9; }
        .like-count-display { font-size: 11px; color: #f43f5e; margin-top: 6px; font-weight: 600; }

        .footer-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 36px;
            display: flex; justify-content: center; align-items: center; padding: 0 16px;
            background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(8px); z-index: 1000;
            border-top: 1px solid var(--border-color); font-size: 11px; color: var(--text-secondary);
        }
        .footer-bar span { color: var(--accent-color); font-weight: 500; margin-left: 4px; }

        @media screen and (max-width: 768px) {
            .main-layout { top: 96px; }
            .mobile-tabs { display: flex; }
            
            .sidebar {
                position: absolute; width: 100%; height: 100%; z-index: 90;
                transform: translateX(-100%); transition: transform 0.3s ease;
            }
            .sidebar.mobile-show { transform: translateX(0); }
            
            .map-container {
                position: absolute; width: 100%; height: 100%; z-index: 80;
                display: none;
            }
            .map-container.mobile-show { display: block; }

            .detail-card {
                left: 12px; right: 12px; top: auto; bottom: 12px; width: auto;
                max-width: none; border-radius: 14px; padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="site-title">🎸 中国独立乐队地图</div>
        <div class="user-quota" id="quotaDisplay">今日剩余心心: 100/100</div>
    </header>

    <div class="mobile-tabs">
        <button class="mobile-tab-btn active" id="tabMap" onclick="switchMobileView('map')">🗺️ 地图模式</button>
        <button class="mobile-tab-btn" id="tabList" onclick="switchMobileView('list')">📋 乐队列表</button>
    </div>

    <div class="main-layout">
        <div class="sidebar" id="sidebarPanel">
            <div class="search-box-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索乐队、城市、风格...">
            </div>
            <div class="rank-section-title">今天你送心心了吗😊</div>
            <div class="band-list" id="bandList"></div>
        </div>
        
        <div class="map-container mobile-show" id="mapPanel">
            <div id="chinaMap"></div>
            <div class="detail-card" id="detailCard">
                <button class="close-btn" onclick="closeDetailCard()">✕</button>
                <div id="cardContent"></div>
            </div>
        </div>
    </div>

    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBands = [];
        let currentSelectedBand = null;
        const myChart = echarts.init(getElementByIdSafe('chinaMap'));

        function getElementIdSafe(id) {
            return document.getElementById(id);
        }

        window.switchMobileView = function(view) {
            const mapPanel = document.getElementById('mapPanel');
            const sidebarPanel = document.getElementById('sidebarPanel');
            const tabMap = document.getElementById('tabMap');
            const tabList = document.getElementById('tabList');

            if (view === 'map') {
                mapPanel.classList.add('mobile-show');
                sidebarPanel.classList.remove('mobile-show');
                tabMap.classList.add('active');
                tabList.classList.remove('active');
                setTimeout(() => myChart.resize(), 100);
            } else {
                mapPanel.classList.remove('mobile-show');
                sidebarPanel.classList.add('mobile-show');
                tabList.classList.add('active');
                tabMap.classList.remove('active');
            }
        }

        function checkAndGetQuota() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let record = JSON.parse(localStorage.getItem('band_like_quota_100') || '{}');
            if (record.date !== todayStr) {
                record = { date: todayStr, count: 100 };
                localStorage.setItem('band_like_quota_100', JSON.stringify(record));
            }
            return record.count;
        }

        function updateQuotaDisplay() {
            document.getElementById('quotaDisplay').innerText = `今日剩余心心: ${checkAndGetQuota()}/100`;
        }

        async function fetchBands() {
            const { data, error } = await supabaseClient.from('bands').select('*').order('likes', { ascending: false });
            if (error) { console.error(error); return; }
            allBands = data || [];
            renderUI(allBands);
            if (allBands.length > 0) {
                const target = currentSelectedBand ? allBands.find(b => b.id === currentSelectedBand.id) || allBands[0] : allBands[0];
                selectBand(target, false);
            }
        }

        function renderUI(bands) {
            updateQuotaDisplay();
            renderList(bands);
            renderMap(bands);
        }

        function selectBand(band, panToCoord = true) {
            currentSelectedBand = band;
            
            document.querySelectorAll('.band-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id == band.id);
            });

            const card = document.getElementById('detailCard');
            const content = document.getElementById('cardContent');
            card.classList.add('show');
            
            content.innerHTML = `
                <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="card-avatar">
                <div class="card-name">${band.name}</div>
                <div class="card-style">${band.style || '独立音乐'}</div>
                <div class="card-city">📍 ${band.city}</div>
                <button class="like-btn" onclick="handleLike(${band.id})">送心心💖</button>
                <div class="like-count-display">获得: <span id="like-count-${band.id}">${band.likes || 0}</span> 💖</div>
            `;

            renderMap(allBands);

            if (window.innerWidth <= 768) {
                switchMobileView('map');
            }

            // 优化点击坐标聚焦：温和的放大倍数与平滑过渡
            if (panToCoord && band.longitude && band.latitude) {
                myChart.setOption({
                    geo: {
                        center: [band.longitude, band.latitude],
                        zoom: window.innerWidth <= 768 ? 2.2 : 1.8,
                        animation: true,
                        animationDuration: 500
                    }
                });
            }
        }

        window.closeDetailCard = function() {
            document.getElementById('detailCard').classList.remove('show');
            currentSelectedBand = null;
            document.querySelectorAll('.band-item').forEach(el => el.classList.remove('active'));
            renderMap(allBands);
        }

        function renderList(bands) {
            const listEl = document.getElementById('bandList');
            listEl.innerHTML = '';
            bands.forEach((band, index) => {
                const item = document.createElement('div');
                item.className = `band-item ${currentSelectedBand && currentSelectedBand.id === band.id ? 'active' : ''}`;
                item.dataset.id = band.id;
                item.innerHTML = `
                    <div class="band-rank-num">${index + 1}</div>
                    <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="band-item-avatar">
                    <div class="band-item-info">
                        <div class="band-item-name">${band.name}</div>
                        <div class="band-item-meta">${band.city} · ${band.style || ''}</div>
                    </div>
                    <div class="band-item-likes">💖 ${band.likes || 0}</div>
                `;
                item.addEventListener('click', () => {
                    selectBand(band, true);
                });
                listEl.appendChild(item);
            });
        }

        function renderMap(bands) {
            const normalData = [];
            const selectedData = [];

            bands.forEach(band => {
                const item = {
                    name: band.name,
                    value: [band.longitude, band.latitude, band.likes || 0],
                    bandInfo: band
                };
                if (currentSelectedBand && currentSelectedBand.id === band.id) {
                    selectedData.push(item);
                } else {
                    normalData.push(item);
                }
            });

            const option = {
                backgroundColor: '#090d16',
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: myChart.getOption() && myChart.getOption().geo ? myChart.getOption().geo[0].zoom : 1.2,
                    center: myChart.getOption() && myChart.getOption().geo ? myChart.getOption().geo[0].center : undefined,
                    itemStyle: {
                        areaColor: '#1e293b',
                        borderColor: '#475569',
                        borderWidth: 1.2
                    },
                    emphasis: {
                        itemStyle: { areaColor: '#334155' }
                    }
                },
                series: [
                    {
                        name: 'normal',
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        data: normalData,
                        symbolSize: function (val) {
                            return Math.min(10 + Math.sqrt(val[2]) * 2, 20);
                        },
                        itemStyle: {
                            color: '#38bdf8',
                            shadowBlur: 6,
                            shadowColor: '#38bdf8'
                        }
                    },
                    {
                        name: 'selected',
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        data: selectedData,
                        symbolSize: 18,
                        showEffectOn: 'render',
                        rippleEffect: {
                            brushType: 'stroke',
                            scale: 3.5,
                            period: 2
                        },
                        itemStyle: {
                            color: '#facc15',
                            shadowBlur: 15,
                            shadowColor: '#facc15'
                        },
                        zlevel: 10
                    }
                ]
            };
            myChart.setOption(option, false);
        }

        myChart.on('click', function (params) {
            if (params.data && params.data.bandInfo) {
                selectBand(params.data.bandInfo, true);
            }
        });

        window.handleLike = async function(bandId) {
            let record = JSON.parse(localStorage.getItem('band_like_quota_100') || '{}');
            if (record.count <= 0) {
                alert('⏰ 今日 100 次送心心机会已用完，请明天再来为喜欢的乐队打Call！');
                return;
            }
            record.count -= 1;
            localStorage.setItem('band_like_quota_100', JSON.stringify(record));
            updateQuotaDisplay();

            const band = allBands.find(b => b.id === bandId);
            const newLikes = (band.likes || 0) + 1;
            
            const { error } = await supabaseClient.from('bands').update({ likes: newLikes }).eq('id', bandId);
            if (error) {
                console.error("更新数据库失败:", error);
            }

            band.likes = newLikes;
            allBands.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            const span = document.getElementById(`like-count-${bandId}`);
            if (span) span.innerText = newLikes;
            renderList(allBands);
            renderMap(allBands);
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const kw = e.target.value.toLowerCase().trim();
            const filtered = allBands.filter(b => 
                b.name.toLowerCase().includes(kw) || 
                b.city.toLowerCase().includes(kw) || 
                (b.style && b.style.toLowerCase().includes(kw))
            );
            renderList(filtered);
            renderMap(filtered);
        });

        window.addEventListener('resize', () => myChart.resize());
        fetchBands();
    </script>
</body>
</html>
