<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>独立乐队地图</title>
    
    <!-- 引入 Leaflet 地图样式与 JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #090d16;
            --panel-bg: rgba(20, 27, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        /* 顶部导航条 */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 主体布局：左侧列表 + 右侧地图 */
        .main-layout {
            position: absolute;
            top: 56px;
            bottom: 36px;
            left: 0;
            width: 100%;
            display: flex;
        }

        /* 左侧乐队列表抽屉 */
        .sidebar {
            width: 320px;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .band-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }

        /* 列表项卡片 */
        .band-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .band-item:hover, .band-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(2px);
        }

        .band-item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #38bdf8;
        }

        .band-item-info {
            flex: 1;
            min-width: 0;
        }

        .band-item-name {
            font-size: 14px;
            font-weight: 600;
            color: #facc15;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .band-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 右侧地图容器 */
        #map {
            flex: 1;
            height: 100%;
            background: #090d16;
            z-index: 1;
        }

        /* 底部标语栏 */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .footer-bar span {
            color: #38bdf8;
            font-weight: 500;
            margin-left: 4px;
        }

        /* 自定义 Leaflet 弹窗气泡美化 */
        .leaflet-popup-content-wrapper {
            background: var(--panel-bg) !important;
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px !important;
            color: var(--text-main) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6) !important;
        }
        .leaflet-popup-tip {
            background: var(--panel-bg) !important;
        }

        /* 弹窗内部排版：圆形头像、无描述文字 */
        .popup-content {
            text-align: center;
            padding: 10px 4px 4px 4px;
        }
        .popup-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            border: 2px solid #38bdf8;
            display: block;
        }
        .popup-name {
            font-size: 16px;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 6px;
        }
        .popup-style {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .popup-city {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 移动端响应式适配：手机上默认隐藏或精简侧边栏 */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 260px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="site-title">🎸 独立乐队地图</div>
    </header>

    <div class="main-layout">
        <!-- 左侧乐队列表 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">乐队目录（点击联动地图）</div>
            <div class="band-list" id="bandList">
                <!-- 动态加载列表 -->
            </div>
        </div>

        <!-- 右侧地图 -->
        <div id="map"></div>
    </div>

    <footer class="footer-bar">
        仅供娱乐｜欢迎乐迷进群交流｜联系美丽且智慧的开发者：<span>vildbloom</span>
    </footer>

    <script>
        // ==========================================
        // 1. 配置你的 Supabase 信息
        // ==========================================
        const SUPABASE_URL = '你的Supabase项目URL'; 
        const SUPABASE_ANON_KEY = '你的Supabase匿名API密匙(anon key)';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 初始化地图（以中国中心为视口）
        const map = L.map('map', {
            zoomControl: false
        }).setView([35.0, 105.0], 4);

        // 加载暗黑科技感地图底图
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO',
            maxZoom: 19
        }).addTo(map);

        // 添加缩放控件到右下角
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let markersMap = {}; // 存储地图上的 Marker 对象以便联动

        // ==========================================
        // 2. 从数据库加载数据并渲染
        // ==========================================
        async function loadBands() {
            const { data: bands, error } = await supabaseClient
                .from('bands')
                .select('*');

            if (error) {
                console.error('获取乐队数据失败:', error);
                return;
            }

            const bandListEl = document.getElementById('bandList');
            bandListEl.innerHTML = '';

            bands.forEach(band => {
                if (!band.latitude || !band.longitude) return;

                // 创建地图 Marker
                const marker = L.marker([band.latitude, band.longitude]).addTo(map);

                // 绑定点击弹窗（去掉了描述文字，缩小为圆形头像）
                const popupHtml = `
                    <div class="popup-content">
                        <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="popup-avatar" alt="头像">
                        <div class="popup-name">${band.name}</div>
                        <div class="popup-style">${band.style || '独立音乐'}</div>
                        <div class="popup-city">📍 ${band.city}</div>
                    </div>
                `;
                marker.bindPopup(popupHtml);

                markersMap[band.id] = marker;

                // 渲染左侧列表项
                const itemEl = document.createElement('div');
                itemEl.className = 'band-item';
                itemEl.innerHTML = `
                    <img src="${band.cover_url || 'https://picsum.photos/200/200'}" class="band-item-avatar" alt="">
                    <div class="band-item-info">
                        <div class="band-item-name">${band.name}</div>
                        <div class="band-item-meta">${band.city} · ${band.style || ''}</div>
                    </div>
                `;

                // 左侧点击联动地图锚定与打开弹窗
                itemEl.addEventListener('click', () => {
                    // 移除其他选中态
                    document.querySelectorAll('.band-item').forEach(el => el.classList.remove('active'));
                    itemEl.classList.add('active');

                    // 地图平滑飞向目标坐标并打开弹窗
                    map.flyTo([band.latitude, band.longitude], 10, {
                        animate: true,
                        duration: 1.2
                    });
                    marker.openPopup();
                });

                bandListEl.appendChild(itemEl);
            });
        }

        loadBands();
    </script>
</body>
</html>
